# Xcode-проект для DevCleaner. Сам DevCleaner.xcodeproj не хранится в git:
#   xcodegen generate && open DevCleaner.xcodeproj
# Package.swift остаётся для `swift build`, `swift test` и scripts/build-app.sh.
name: DevCleaner
options:
  bundleIdPrefix: local.devcleaner
  developmentLanguage: ru
  deploymentTarget:
    macOS: "14.0"
  # Без этого Xcode после генерации может выбрать схему пакета, а не приложения.
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  DevCleaner:
    type: application
    platform: macOS
    sources:
      - path: Sources/DevCleaner
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: DevCleaner
        PRODUCT_BUNDLE_IDENTIFIER: local.devcleaner.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DevCleaner
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        # Не в песочнице: приложению нужен доступ к ~/Library, ~/.gradle и т. п.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # Локальная ad-hoc подпись, как у scripts/build-app.sh.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets:
        - DevCleanerTests
  DevCleanerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DevCleanerTests
    dependencies:
      - target: DevCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.devcleaner.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DevCleaner.app/Contents/MacOS/DevCleaner"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
